[package]
name = "akita-metal"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["Markos Georghiades <mgeorghiades@a16z.com>"]
license = "Apache-2.0 OR MIT"
description = "Optional Apple Metal compute backend for Akita commitments."
repository = "https://github.com/LayerZero-Labs/akita"
keywords = ["cryptography", "zkp", "metal", "gpu"]
categories = ["cryptography", "algorithms"]
include = ["src/**", "benches/**", "Cargo.toml"]

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"

[features]
default = ["parallel"]
parallel = [
  "akita-algebra/parallel",
  "akita-field/parallel",
  "akita-prover/parallel",
]

[dependencies]
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
akita-field = { version = "0.1.0", path = "../akita-field" }
akita-prover = { version = "0.1.0", path = "../akita-prover" }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
akita-sumcheck = { version = "0.1.0", path = "../akita-sumcheck", default-features = false }
akita-transcript = { version = "0.1.0", path = "../akita-transcript", default-features = false }
akita-types = { version = "0.1.0", path = "../akita-types", default-features = false }
thiserror = "2.0"
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"

[dev-dependencies]
akita-config = { version = "0.1.0", path = "../akita-config" }
akita-planner = { version = "0.1.0", path = "../akita-planner" }
akita-prover = { version = "0.1.0", path = "../akita-prover", features = [
  "test-support",
] }

[[bench]]
name = "packed_onehot_commit"
harness = false

[lints]
workspace = true
