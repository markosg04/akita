[package]
name = "akita-transcript"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Fiat-Shamir transcripts for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
jolt-inlines-blake2 = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "c2372a0a9ffd2b37768e501b90037c146664757d", default-features = false, optional = true, features = [
  "digest",
] }
akita-error = { version = "0.1.0", path = "../akita-error" }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "c2372a0a9ffd2b37768e501b90037c146664757d", default-features = false, features = [
  "asm",
  "solinas",
] }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
blake2 = "0.11.0"
spongefish = { git = "https://github.com/arkworks-rs/spongefish", rev = "d2d190b1329d35ac9577438d05aed4f17a57b9f9", default-features = false, optional = true, features = [
  "yolocrypto",
] }

[features]
default = ["transcript-blake2b"]
# Blake2b sponge over the jolt-inlines hasher (a RISC-V guest verifier); same
# bytes as the `blake2` crate.
blake2-inline = ["dep:jolt-inlines-blake2"]
logging-transcript = []
# spongefish 0.7 imports StdHash from its prover/verifier/domain modules
# even when Akita selects Blake2b explicitly, so sha3 is required
# for the crate to compile with default-features disabled.
transcript-blake2b = ["dep:spongefish", "spongefish/blake2", "spongefish/sha3"]
# Retained only to report a clear compile-time error for retired callers.
transcript-keccak = []

[lints]
workspace = true
