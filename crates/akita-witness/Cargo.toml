[package]
name = "akita-witness"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Shared borrowed witness/polynomial view vocabulary for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "c2372a0a9ffd2b37768e501b90037c146664757d", default-features = false, features = [
  "asm",
  "solinas",
] }

[lints]
workspace = true
