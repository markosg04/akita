akita-error = { git = "https://github.com/markosg04/akita.git", rev = "2bceddba86e07971bbd0538e46060df3caf3031b" }
akita-pcs = { git = "https://github.com/markosg04/akita.git", rev = "2bceddba86e07971bbd0538e46060df3caf3031b" }
akita-planner = { git = "https://github.com/markosg04/akita.git", rev = "2bceddba86e07971bbd0538e46060df3caf3031b" }
akita-prover = { git = "https://github.com/markosg04/akita.git", rev = "2bceddba86e07971bbd0538e46060df3caf3031b" }
akita-schedules = { git = "https://github.com/markosg04/akita.git", rev = "2bceddba86e07971bbd0538e46060df3caf3031b" }
akita-serialization = { git = "https://github.com/markosg04/akita.git", rev = "2bceddba86e07971bbd0538e46060df3caf3031b" }
