[advisories]
version = 2
yanked = "deny"
ignore = [
  # Transitive through spongefish -> Plonky3. No safe upstream replacement exists.
  "RUSTSEC-2024-0436",
  # Maintenance advisory: retain bincode 2.0.1 for the existing
  # bounded, application-trusted binary schedule format. See docs/security-posture.md.
  "RUSTSEC-2025-0141",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/a16z/jolt",
  # BN254 sampling vectors use jolt-field's existing Arkworks backend.
  "https://github.com/a16z/arkworks-algebra",
  "https://github.com/arkworks-rs/algebra",
  "https://github.com/arkworks-rs/spongefish",
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
